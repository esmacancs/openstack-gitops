# =============================================================================
# GLOBAL CONFIGURATIONS
# =============================================================================

# Disable Helm 3 hooks for GitOps compatibility
helm3_hook: false

# Global image pull secrets for all services
images:
  pull_secrets:
    - dockerhub-creds

# Global bootstrap configuration for keystone
bootstrap:
  enabled: true
  ks_user: admin
  ks_project: admin
  ks_role: admin
  region: RegionOne

# Global secrets configuration
secrets:
  fernet_keys:
    secret_name: keystone-fernet-keys

# =============================================================================
# CEPH STORAGE CONFIGURATION
# =============================================================================

# Ceph configuration for OpenStack services
conf:
  ceph:
    enabled: true
    cluster_namespace: rook-ceph

# Ceph client pools for each service
ceph_client:
  cinder:
    user: cinder
    pool: volumes
  glance:
    user: glance
    pool: images
  nova:
    user: nova
    pool: vms

# =============================================================================
# NETWORKING & INGRESS CONFIGURATION
# =============================================================================

# Global network configuration for HAProxy ingress
network:
  api:
    ingress:
      classes:
        namespace: "ingress-openstack"
        cluster: "ingress-openstack"
      annotations:
        haproxy.org/path-rewrite: "/"

# =============================================================================
# MESSAGING & DATABASE CONFIGURATION
# =============================================================================

# RabbitMQ cluster configuration
rabbitmq:
  cluster_partition_handling: autoheal

# Global pod replica configuration
pod:
  replicas:
    server: 3

# Global volume configuration
volume:
  class_name: general
  size: 5Gi

# MariaDB database configuration
mariadb:
  volume:
    enabled: true
    class_name: general
    size: 20Gi
  pod:
    replicas:
      server: 3

# Memcached configuration
memcached:
  replicas: 3

# =============================================================================
# OPENSTACK IDENTITY SERVICE (KEYSTONE)
# =============================================================================

# =============================================================================
# OPENSTACK IDENTITY SERVICE (KEYSTONE)
# =============================================================================

# Keystone identity service configuration
keystone:
  pod:
    replicas:
      api: 3
  bootstrap:
    enabled: true
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
        annotations:
          haproxy.org/path-rewrite: "/"
  endpoints:
    identity:
      host_fqdn_override:
        public:
          host: keystone.10.8.132.108.sslip.io

# Keystone resources (projects, users, roles)
keystone-resources:
  enabled: true

# =============================================================================
# OPENSTACK IMAGE SERVICE (GLANCE)
# =============================================================================

# Glance image service with Ceph RBD backend
glance:
  storage:
    type: rbd
    rbd:
      pool: images
      user: glance
      secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  conf:
    glance:
      DEFAULT:
        show_image_direct_url: true
      glance_store:
        default_store: rbd
        stores: rbd
        rbd_store_pool: images
        rbd_store_user: glance
        rbd_store_ceph_conf: /etc/ceph/ceph.conf
        rbd_store_chunk_size: 8
  pod:
    replicas:
      api: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    image:
      host_fqdn_override:
        public:
          host: glance.10.8.132.108.sslip.io
        internal:
          host: glance.openstack.svc.cluster.local

# =============================================================================
# OPENSTACK COMPUTE SERVICE (NOVA)
# =============================================================================

# Nova compute service configuration
nova:
  nova_compute:
    enabled: true
  manifests:
    daemonset_compute: true
  pod:
    replicas:
      api_metadata: 3
      conductor: 3
      novncproxy: 0
      osapi: 3
      scheduler: 3
      spiceproxy: 3
  useHostNetwork:
    novncproxy: false
  endpoints:
    compute:
      host_fqdn_override:
        public:
          host: nova.10.8.132.108.sslip.io
        internal:
          host: nova.openstack.svc.cluster.local
  image:
    nova_novncproxy: ghcr.io/vexxhost/nova:main@sha256:c289d782faebcd2d1c4055ded69110dacb38ea7d2ae59712bbecb452dd448442
    nova_novncproxy_assets: ghcr.io/vexxhost/nova:main@sha256:c289d782faebcd2d1c4055ded69110dacb38ea7d2ae59712bbecb452dd448442
  conf:
    nova:
      spice:
        enabled: true
        html5proxy_base_url: http://spiceproxy.openstack.svc.cluster.local:6082/
      vnc:
        enabled: false  

# =============================================================================
# OPENSTACK BLOCK STORAGE SERVICE (CINDER)
# =============================================================================

# Cinder block storage with Ceph RBD backend
cinder:
  pod:
    replicas:
      api: 3
      volume: 3
      scheduler: 3
      backup: 1
  conf:
    cinder:
      DEFAULT:
        enabled_backends: "rbd1"
      rbd1:
        volume_driver: cinder.volume.drivers.rbd.RBDDriver
        volume_backend_name: rbd1
        rbd_pool: volumes
        rbd_ceph_conf: /etc/ceph/ceph.conf
        rbd_flatten_volume_from_snapshot: false
        rbd_max_clone_depth: 5
        rbd_store_chunk_size: 4
        rados_connect_timeout: -1
        rbd_user: cinder
        rbd_secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    volume:
      host_fqdn_override:
        public:
          host: cinder.10.8.132.108.sslip.io
        internal:
          host: cinder.openstack.svc.cluster.local

# =============================================================================
# OPENSTACK NETWORKING SERVICE (NEUTRON)
# =============================================================================

# Neutron networking service with OpenVSwitch
neutron:
  neutron_agent:
    enabled: false
  pod:
    replicas:
      server: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    network:
      host_fqdn_override:
        public:
          host: neutron.10.8.132.108.sslip.io
        internal:
          host: neutron.openstack.svc.cluster.local
  conf:
    neutron:
      DEFAULT:
        core_plugin: ml2
        service_plugins: router
    plugins:
      ml2_conf:
        ml2:
          type_drivers: flat,vlan,vxlan
          tenant_network_types: vxlan
          mechanism_drivers: openvswitch
          extension_drivers: port_security
        ml2_type_flat:
          flat_networks: provider
        ml2_type_vlan:
          network_vlan_ranges: provider:3411:3411
        ml2_type_vxlan:
          vni_ranges: 1:1000
          vxlan_group: 239.1.1.1
        ovs:
          bridge_mappings: provider:br-provider
          local_ip: $HOST_IP

# =============================================================================
# OPENSTACK DASHBOARD (HORIZON)
# =============================================================================

# Horizon web dashboard with custom branding
horizon:
  replicaCount: 3
  endpoints:
    dashboard:
      host_fqdn_override:
        public:
          host: horizon.10.8.132.108.sslip.io
        internal:
          host: horizon.openstack.svc.cluster.local
  conf:
    horizon:
      branding:
        logo: ""
        logo_splash: ""
      local_settings:
        ALLOWED_HOSTS: 
          - "horizon.10.8.132.108.sslip.io"
          - "horizon"
          - "horizon.openstack"
          - "*"
      console:
        type: spice
  manifests:
    configmap_logo: true

# =============================================================================
# OPENSTACK PLACEMENT SERVICE
# =============================================================================

# Placement service for resource tracking
placement:
  pod:
    replicas:
      api: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    placement:
      host_fqdn_override:
        public:
          host: placement.10.8.132.108.sslip.io
        internal:
          host: placement.openstack.svc.cluster.local

# =============================================================================
# CEPH ADAPTER FOR ROOK
# =============================================================================

# Ceph adapter configuration for Rook integration
ceph-adapter-rook:
  ceph_cluster_namespace: rook-ceph
  mon_endpoints:
    - 10.8.132.105:6789
    - 10.8.132.104:6789
    - 10.8.132.103:6789

