helm3_hook: false

network:
  api:
    ingress:
      classes:
        namespace: "ingress-openstack"
        cluster: "ingress-openstack"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /

pod:
  replicas:
    server: 3

volume:
  class_name: general
  size: 5Gi

conf:
  rabbitmq:
    cluster_partition_handling: autoheal



mariadb:
  volume:
    enabled: true
    class_name: general
    size: 20Gi
  pod:
    replicas:
      server: 3

memcached:
  replicas: 3

keystone:
  pod:
    replicas:
      api: 3
  bootstrap:
    enabled: true
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    identity:
      host_fqdn_override:
        public:
          host: keystone.10-8-132-108.sslip.io
        internal:
          host: keystone.openstack.svc.cluster.local
keystone-resources:
    enabled: true

glance:
  storage:
    type: rbd
    rbd:
      pool: images
      user: glance
      secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  conf:
    glance:
      DEFAULT:
        show_image_direct_url: true
      glance_store:
        default_store: rbd
        stores: rbd
        rbd_store_pool: images
        rbd_store_user: glance
        rbd_store_ceph_conf: /etc/ceph/ceph.conf
        rbd_store_chunk_size: 8
  pod:
    replicas:
      api: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    image:
      host_fqdn_override:
        public:
          host: glance.10-8-132-108.sslip.io
        internal:
          host: glance.openstack.svc.cluster.local

nova:
  nova_compute:
    enabled: false
  pod:
    replicas:
      api: 3
      conductor: 3
      scheduler: 3
  endpoints:
    compute:
      host_fqdn_override:
        public:
          host: nova.10-8-132-108.sslip.io
        internal:
          host: nova.openstack.svc.cluster.local

neutron:
  neutron_agent:
    enabled: false
  pod:
    replicas:
      server: 3
  endpoints:
    network:
      host_fqdn_override:
        public:
          host: neutron.10-8-132-108.sslip.io
        internal:
          host: neutron.openstack.svc.cluster.local

horizon:
  replicaCount: 3
  endpoints:
    dashboard:
      host_fqdn_override:
        public:
          host: horizon.10-8-132-108.sslip.io
        internal:
          host: horizon.openstack.svc.cluster.local
  conf:
    horizon:
      branding:
        logo: ""
        logo_splash: "PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjUwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgogIDxkZWZzPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJncmFkMSIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMCUiPgogICAgICA<"
  manifests:
    configmap_logo: true

elasticsearch:
  replicaCount: 1
