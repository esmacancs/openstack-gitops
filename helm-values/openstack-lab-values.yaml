helm3_hook: false
conf:
  ceph:
    enabled: true
    cluster_namespace: rook-ceph
ceph_client:
  cinder:
    user: cinder
    pool: volumes
  glance:
    user: glance
    pool: images
  nova:
    user: nova
    pool: vms
network:
  api:
    ingress:
      classes:
        namespace: "ingress-openstack"
        cluster: "ingress-openstack"
      annotations:
        haproxy.org/path-rewrite: "/"

pod:
  replicas:
    server: 3

volume:
  class_name: general
  size: 5Gi

conf:
  rabbitmq:
    cluster_partition_handling: autoheal



mariadb:
  volume:
    enabled: true
    class_name: general
    size: 20Gi
  pod:
    replicas:
      server: 3

memcached:
  replicas: 3

keystone:
  pod:
    replicas:
      api: 3
  bootstrap:
    enabled: true
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
        annotations:
          haproxy.org/path-rewrite: "/"
  endpoints:
    identity:
      host_fqdn_override:
        public:
          host: keystone.10.8.132.108.sslip.io
keystone-resources:
    enabled: true

glance:
  storage:
    type: rbd
    rbd:
      pool: images
      user: glance
      secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  conf:
    glance:
      DEFAULT:
        show_image_direct_url: true
      glance_store:
        default_store: rbd
        stores: rbd
        rbd_store_pool: images
        rbd_store_user: glance
        rbd_store_ceph_conf: /etc/ceph/ceph.conf
        rbd_store_chunk_size: 8
  pod:
    replicas:
      api: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    image:
      host_fqdn_override:
        public:
          host: glance.10.8.132.108.sslip.io
        internal:
          host: glance.openstack.svc.cluster.local

nova:
  nova_compute:
    enabled: false
  manifests:
    daemonset_compute: false
#  pod:
#    replicas:
#      api: 3
#      conductor: 3
#      scheduler: 3
pod:
  replicas:
    api_metadata: 3
    conductor: 3
    novncproxy: 3
    osapi: 3
    scheduler: 3
    spiceproxy: 3
  useHostNetwork:
    novncproxy: false
  endpoints:
    compute:
      host_fqdn_override:
        public:
          host: nova.10.8.132.108.sslip.io
        internal:
          host: nova.openstack.svc.cluster.local

cinder:
  pod:
    replicas:
      api: 3
      volume: 3
      scheduler: 3
      backup: 1
  conf:
    cinder:
      DEFAULT:
        enabled_backends: "rbd1"
      rbd1:
        volume_driver: cinder.volume.drivers.rbd.RBDDriver
        volume_backend_name: rbd1
        rbd_pool: volumes
        rbd_ceph_conf: /etc/ceph/ceph.conf
        rbd_flatten_volume_from_snapshot: false
        rbd_max_clone_depth: 5
        rbd_store_chunk_size: 4
        rados_connect_timeout: -1
        rbd_user: cinder
        rbd_secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    volume:
      host_fqdn_override:
        public:
          host: cinder.10.8.132.108.sslip.io
        internal:
          host: cinder.openstack.svc.cluster.local

neutron:
  neutron_agent:
    enabled: false
  pod:
    replicas:
      server: 3
  network:
    api:
      ingress:
        classes:
          namespace: "ingress-openstack"
          cluster: "ingress-openstack"
  endpoints:
    network:
      host_fqdn_override:
        public:
          host: neutron.10.8.132.108.sslip.io
        internal:
          host: neutron.openstack.svc.cluster.local
  conf:
    neutron:
      DEFAULT:
        core_plugin: ml2
        service_plugins: router
    plugins:
      ml2_conf:
        ml2:
          type_drivers: flat,vlan,vxlan
          tenant_network_types: vxlan
          mechanism_drivers: openvswitch
          extension_drivers: port_security
        ml2_type_flat:
          flat_networks: provider
        ml2_type_vlan:
          network_vlan_ranges: provider:3411:3411
        ml2_type_vxlan:
          vni_ranges: 1:1000
          vxlan_group: 239.1.1.1
        ovs:
          bridge_mappings: provider:br-provider
          local_ip: $HOST_IP

horizon:
  replicaCount: 3
  endpoints:
    dashboard:
      host_fqdn_override:
        public:
          host: horizon.10.8.132.108.sslip.io
        internal:
          host: horizon.openstack.svc.cluster.local
  conf:
    horizon:
      branding:
        logo: ""
        logo_splash: "PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjUwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgogIDxkZWZzPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJncmFkMSIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMCUiPgogICAgICA<"
      local_settings:
        ALLOWED_HOSTS: 
          - "horizon.10.8.132.108.sslip.io"
          - "horizon"
          - "horizon.openstack"
          - "*"
  manifests:
    configmap_logo: true

elasticsearch:
  replicaCount: 1

ceph-adapter-rook:
  ceph_cluster_namespace: rook-ceph
  mon_endpoints:
    - 10.8.132.105:6789
    - 10.8.132.104:6789
    - 10.8.132.103:6789

