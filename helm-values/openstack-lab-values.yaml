helm3_hook: false

pod:
  replicas:
    server: 1

volume:
  class_name: general
  size: 5Gi

conf:
  rabbitmq:
    cluster_partition_handling: autoheal



mariadb:
  volume:
    enabled: false
  pod:
    replicas:
      server: 1

memcached:
  replicas: 1

keystone:
  pod:
    replicas:
      api: 1
  bootstrap:
    enabled: true
keystone-resources:
    enabled: true

glance:
  storage:
    type: rbd
    rbd:
      pool: images
      user: glance
      secret_uuid: 457eb676-33da-42ec-9a8c-9293d545c337
  conf:
    glance:
      DEFAULT:
        show_image_direct_url: true
      glance_store:
        default_store: rbd
        stores: rbd
        rbd_store_pool: images
        rbd_store_user: glance
        rbd_store_ceph_conf: /etc/ceph/ceph.conf
        rbd_store_chunk_size: 8
  pod:
    replicas:
      api: 1

nova:
  nova_compute:
    enabled: false
  pod:
    replicas:
      api: 1
      conductor: 1
      scheduler: 1

neutron:
  neutron_agent:
    enabled: false
  pod:
    replicas:
      server: 1

horizon:
  replicaCount: 1
  conf:
    horizon:
      branding:
        logo: ""
        logo_splash: "PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjUwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgogIDxkZWZzPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJncmFkMSIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMCUiPgogICAgICA<"
  manifests:
    configmap_logo: true

elasticsearch:
  replicaCount: 1
