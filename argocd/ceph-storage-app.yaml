apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/esmacancs/openstack-gitops.git
    targetRevision: HEAD
    path: .
    plugin:
      name: kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
