
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default

  # ✅ MULTI-SOURCE SETUP
  sources:
    # 1️⃣ Helm chart source
    - repoURL: https://github.com/esmacancs/openstack-gitops.git
      targetRevision: main
      path: charts/nova
      helm:
        valueFiles:
          - $values/helm-values/nova-override.yaml

    # 2️⃣ Values source (referenced by $values)
    - repoURL: https://github.com/esmacancs/openstack-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: openstack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
